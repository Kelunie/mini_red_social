<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Social del Salón</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
</head>
<body>

  <div class="container">

    <h1 class="titulo-principal">Red Social del Salón</h1>
    <p class="text-muted">Escribe tu nombre y comparte un mensaje con tus compañeros.</p>

    <!-- Navegación de Vistas -->
    <ul class="nav nav-tabs mb-4" id="vistas-nav">
      <li class="nav-item">
        <button class="nav-link active" id="btn-vista-muro" type="button">Muro</button>
      </li>      
      <li class="nav-item">
        <button class="nav-link" id="btn-vista-moderacion" type="button">Moderación</button>
      </li>
    </ul>

    <!-- Contenedor Vista Muro -->
    <div id="vista-muro-container">
      <!-- Resumen de Actividad (H10) -->
      <div class="tarjeta-resumen mb-4" id="resumen-actividad">
      <h5 class="titulo-resumen">Resumen de Actividad</h5>
      <div class="row text-center mb-3 pb-3 border-resumen">
        <div class="col-6">
          <div class="resumen-item">
            <span class="resumen-numero" id="total-publicaciones">0</span>
            <span class="resumen-etiqueta">Publicaciones</span>
          </div>
        </div>
        <div class="col-6">
          <div class="resumen-item">
            <span class="resumen-numero" id="total-comentarios">0</span>
            <span class="resumen-etiqueta">Comentarios</span>
          </div>
        </div>
      </div>
      <div class="row text-center g-2">
        <div class="col-3">
          <div class="resumen-item-mini">
            <span class="resumen-numero-mini" id="total-likes">0</span>
            <span class="resumen-etiqueta-mini">👍 Me gusta</span>
          </div>
        </div>
        <div class="col-3">
          <div class="resumen-item-mini">
            <span class="resumen-numero-mini" id="total-loves">0</span>
            <span class="resumen-etiqueta-mini">❤️ Me encanta</span>
          </div>
        </div>
        <div class="col-3">
          <div class="resumen-item-mini">
            <span class="resumen-numero-mini" id="total-dislikes">0</span>
            <span class="resumen-etiqueta-mini">👎 No me gusta</span>
          </div>
        </div>
        <div class="col-3">
          <div class="resumen-item-mini">
            <span class="resumen-numero-mini" id="total-angries">0</span>
            <span class="resumen-etiqueta-mini">😡 Me enoja</span>
          </div>
        </div>
      </div>
    </div>


    <div class="tarjeta-form mb-4">
      <form id="form-publicacion">
        <div class="mb-3">
          <label for="input-nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="input-nombre" placeholder="Escribe tu nombre">
        </div>

        <div class="mb-3">
          <label for="input-mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="input-mensaje" rows="3" placeholder="Escribe tu mensaje..."></textarea>
        </div>

        <div class="mb-3">
          <label for="input-etiqueta" class="form-label">Etiqueta</label>
          <select class="form-select" id="input-etiqueta">
            <option value="General" selected>General</option>
            <option value="Estudio">Estudio</option>
            <option value="Evento">Evento</option>
            <option value="Ayuda">Ayuda</option>
          </select>
        </div>

        <button type="submit" class="btn-publicar">Publicar</button>
        <button type="button" id="btn-descartar-borrador" class="btn btn-secondary ms-2">Descartar borrador</button>
      </form>
    </div>

    <h5 class="titulo-muro">Publicaciones</h5>
    <div id="lista-publicaciones">
    </div>

    </div> <!-- Cierre de #vista-muro-container -->

    <!-- Contenedor Vista Moderación -->
    <div id="vista-moderacion-container" class="d-none">
      <h5 class="titulo-muro mb-3">Panel de Moderación</h5>
      <div id="lista-reportados" class="mt-3">
        <!-- Las publicaciones reportadas se renderizarán aquí -->
      </div>
    </div>

  </div>

  <script src="js/index.js"></script>
</body>
</html>
